[package]
name = "mnestic-mem-adapter"
version = "0.1.0"
edition = "2021"
description = "Adaptation layer: Mem-mode interactive mnestic instance + CozoScript HTTP endpoint (no mnestic source changes)"
publish = false

[dependencies]
# storage-rocksdb 已启用（2026-09-24）：本机已装 LLVM/libclang（zstd-sys bindgen 硬依赖）。
# mnestic-rocks → librocksdb-sys 为 C++ 源码编译，耗时较长；构建需 LIBCLANG_PATH（见 README）。
mnestic = { version = "0.17.0", features = ["storage-rocksdb"] }
serde_json = "1"
